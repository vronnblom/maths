# The Calculus curriculum: the plan, in machine-readable form (docs/plan/02 §2.5).
# Imported once from docs/plan/08-calculus-curriculum.md; from now on this file is the source,
# and 08 is the commentary. Page front matter is the truth for written pages: `graph.py check`
# fails if a written page disagrees with its entry here (label, file, title, level,
# prerequisites).
#
# Per topic: label, file (relative to content/calculus/), title, level (core | extension),
# prerequisites (direct only), objectives, widgets, results, notes.
# Per result: label, policy (F full proof in core, R rigorous track, S sketch, D deferred;
# "S+R" means a sketch in the core and the full proof in the rigorous track, "S+D" a sketch
# here and the full proof deferred; a note says which part gets which policy), deferred_to (a
# topic label, a subject code, or out-of-scope; required with D), note.
subject: calc
chapters:
  - slug: preliminaries
    title: Preliminaries
    topics:
      - label: calc-real-numbers
        file: preliminaries/real-numbers-and-intervals.md
        title: Real Numbers and Intervals
        level: core
        prerequisites: []
        objectives:
          - Use interval and set-builder notation.
          - "Distinguish ℕ, ℤ, ℚ, ℝ."
          - State what "bounded above" and "supremum" mean (rigorous track).
        results:
          - {label: def-calc-interval}
          - {label: ax-calc-completeness, policy: S, note: "completeness axiom (stated, rigorous track)"}
          - {label: thm-calc-sqrt2-irrational, policy: F}
      - label: calc-absolute-value-inequalities
        file: preliminaries/absolute-value-and-inequalities.md
        title: Absolute Value and Inequalities
        level: core
        prerequisites: [calc-real-numbers]
        objectives:
          - "Solve linear, quadratic and absolute-value inequalities."
          - Translate $\lvert x-a\rvert<\delta$ into an interval.
          - Apply the triangle inequality.
        results:
          - {label: def-calc-absolute-value}
          - {label: thm-calc-triangle-inequality, policy: F}
          - {label: prop-calc-abs-interval, policy: F, note: $\lvert x-a\rvert<\delta \iff a-\delta<x<a+\delta$}
      - label: calc-functions
        file: preliminaries/functions.md
        title: Functions and Their Graphs
        level: core
        prerequisites: [calc-real-numbers]
        objectives:
          - Determine the natural domain and the range.
          - Read and sketch graphs.
          - Recognise even/odd and increasing/decreasing functions.
          - Model a situation with a function.
        results:
          - {label: def-calc-function}
          - {label: def-calc-domain-range}
          - {label: def-calc-even-odd}
          - {label: def-calc-monotone}
      - label: calc-function-operations
        file: preliminaries/combining-and-transforming-functions.md
        title: Combining and Transforming Functions
        level: core
        prerequisites: [calc-functions]
        objectives:
          - Form compositions and find their domains.
          - Decompose a function into a composition.
          - "Predict the effect of shifts, stretches and reflections on a graph."
        widgets: [function-plot]
        results:
          - {label: def-calc-composition}
          - {label: prop-calc-graph-transformations, policy: F}
        notes:
          - "Widget function-plot: sliders for $a f(b(x-c))+d$"
      - label: calc-inverse-functions
        file: preliminaries/inverse-functions.md
        title: Inverse Functions
        level: core
        prerequisites: [calc-function-operations]
        objectives:
          - Test injectivity.
          - Find inverse functions and their domains.
          - "Relate the graphs of $f$ and $f^{-1}$."
          - Restrict domains to obtain invertibility.
        results:
          - {label: def-calc-injective}
          - {label: def-calc-inverse-function}
          - {label: prop-calc-strictly-monotone-injective, policy: F}
          - {label: prop-calc-inverse-graph-reflection, policy: F}
      - label: calc-polynomial-rational
        file: preliminaries/polynomial-and-rational-functions.md
        title: Polynomial and Rational Functions
        level: core
        prerequisites: [calc-functions]
        objectives:
          - Factor polynomials using known roots.
          - Perform polynomial division.
          - "Find domains, zeros and the sign of rational functions."
        results:
          - {label: thm-calc-factor-theorem, policy: F}
          - {label: thm-calc-polynomial-division, policy: S}
          - {label: thm-calc-polynomial-roots-bound, policy: F, note: at most $n$ roots}
      - label: calc-exponential-functions
        file: preliminaries/exponential-functions.md
        title: Exponential Functions and the Number e
        level: core
        prerequisites: [calc-function-operations]
        objectives:
          - Apply the laws of exponents.
          - Graph $a^x$ for different bases.
          - Model growth and decay.
          - Describe $e$ via continuous compounding.
        results:
          - {label: def-calc-exponential-function, policy: S+D, deferred_to: calc-ln-integral, note: "rational exponents, extension to real exponents S, rigorous construction D"}
          - {label: prop-calc-exponent-laws, policy: S, note: stated}
          - {label: def-calc-e, policy: D, deferred_to: calc-ln-integral, note: "informal: $\\lim_{n\\to\\infty}(1+1/n)^n$, made precise later"}
      - label: calc-logarithms
        file: preliminaries/logarithms.md
        title: Logarithms
        level: core
        prerequisites: [calc-exponential-functions, calc-inverse-functions]
        objectives:
          - Define $\log_b$ as the inverse of $b^x$.
          - Use the logarithm laws and change of base.
          - Solve exponential equations.
        results:
          - {label: def-calc-logarithm}
          - {label: def-calc-ln}
          - {label: thm-calc-log-laws, policy: F, note: from exponent laws}
          - {label: prop-calc-change-of-base, policy: F}
      - label: calc-trig-functions
        file: preliminaries/trigonometric-functions.md
        title: Trigonometric Functions
        level: core
        prerequisites: [calc-functions]
        objectives:
          - Work in radians.
          - Define sin and cos on the unit circle.
          - Use the core identities.
          - "Graph trigonometric functions with amplitude, period and phase."
        widgets: [function-plot]
        results:
          - {label: def-calc-radian}
          - {label: def-calc-sin-cos}
          - {label: def-calc-tan-sec-csc-cot}
          - {label: thm-calc-pythagorean-identity, policy: F}
          - {label: prop-calc-sin-bounded, policy: F, note: "$-1\\le\\sin t\\le 1$ for real $t$, from the Pythagorean identity; used by calc-limit"}
          - {label: prop-calc-sin-multiples-of-pi, policy: F, note: "$\\sin(k\\pi)=0$ for every integer $k$, from the unit circle; used by calc-limit"}
          - {label: prop-calc-sin-maxima, policy: F, note: "$\\sin(\\pi/2+2k\\pi)=1$ for every integer $k$, from the unit circle; used by calc-limit"}
          - {label: thm-calc-addition-formulas, policy: R, note: geometric proof}
          - {label: lem-calc-sin-bounds, policy: F, note: "$\\sin\\theta<\\theta<\\tan\\theta$ for $0<\\theta<\\pi/2$, by comparing areas"}
        notes:
          - "Widget function-plot: unit circle ↔ graph"
      - label: calc-inverse-trig
        file: preliminaries/inverse-trigonometric-functions.md
        title: Inverse Trigonometric Functions
        level: core
        prerequisites: [calc-trig-functions, calc-inverse-functions]
        objectives:
          - "Define arcsin, arccos and arctan with their principal ranges."
          - Evaluate and simplify expressions like $\cos(\arcsin x)$.
          - "Avoid the $\\sin^{-1}$ ambiguity."
        results:
          - {label: def-calc-arcsin}
          - {label: def-calc-arccos}
          - {label: def-calc-arctan}
          - {label: prop-calc-arcsin-arccos-sum, policy: F}
      - label: calc-hyperbolic-functions
        file: preliminaries/hyperbolic-functions.md
        title: Hyperbolic Functions
        level: extension
        prerequisites: [calc-exponential-functions]
        objectives:
          - "Define sinh, cosh and tanh."
          - Prove $\cosh^2-\sinh^2=1$.
          - Relate them to the hyperbola.
        results:
          - {label: def-calc-hyperbolic}
          - {label: thm-calc-hyperbolic-identity, policy: F}
      - label: calc-complex-numbers
        file: preliminaries/complex-numbers.md
        title: Complex Numbers
        level: extension
        prerequisites: [calc-trig-functions, calc-polynomial-rational]
        objectives:
          - Compute in rectangular and polar form.
          - "Use $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$ as notation (justified by `calc-taylor-series`)."
          - Solve quadratics with complex roots.
        results:
          - {label: def-calc-complex-number}
          - {label: def-calc-complex-polar}
          - {label: thm-calc-de-moivre, policy: F}
          - {label: def-calc-euler-formula, policy: D, deferred_to: calc-taylor-series, note: "definition here, consistency with series"}
  - slug: limits
    title: Limits
    topics:
      - label: calc-limit
        file: limits/limit-of-a-function.md
        title: The Limit of a Function
        level: core
        prerequisites: [calc-functions, calc-absolute-value-inequalities]
        objectives:
          - Estimate limits from tables and graphs and explain how this can mislead.
          - State the precise (ε–δ) definition and interpret it as an ε–δ game.
          - Prove limits of linear and quadratic functions from the definition.
          - Recognise when a limit does not exist.
        widgets: [epsilon-delta, function-plot]
        results:
          - {label: def-calc-limit, note: "precise definition, in core with intuitive unpacking"}
          - {label: thm-calc-limit-unique, policy: R}
          - {label: eg-calc-limit-linear-eps-delta, policy: F, note: worked ε–δ proof in core}
          - {label: eg-calc-limit-quadratic-eps-delta, policy: R}
          - {label: eg-calc-limit-sin-1-over-x, note: non-existence}
        notes:
          - gold-standard page
          - "Widget epsilon-delta: signature widget"
          - "Widget function-plot: table of values, zoom"
      - label: calc-one-sided-limits
        file: limits/one-sided-limits.md
        title: One-Sided Limits
        level: core
        prerequisites: [calc-limit]
        objectives:
          - "Compute left and right limits, including for piecewise functions."
          - Decide existence of a limit from the one-sided limits.
        results:
          - {label: def-calc-one-sided-limit}
          - {label: thm-calc-limit-iff-one-sided, policy: R}
      - label: calc-limit-laws
        file: limits/limit-laws.md
        title: Limit Laws
        level: core
        prerequisites: [calc-limit]
        objectives:
          - "Evaluate limits with the sum, product, quotient, power and root laws."
          - Justify direct substitution for polynomials and rational functions.
          - Identify when the laws do not apply.
        results:
          - {label: thm-calc-limit-laws, policy: F+R+S, note: "sum F as the model ε/2 proof; product, quotient R; power, root S"}
          - {label: cor-calc-direct-substitution, policy: F}
      - label: calc-computing-limits
        file: limits/computing-limits.md
        title: Computing Limits Algebraically
        level: core
        prerequisites: [calc-limit-laws, calc-polynomial-rational]
        objectives:
          - "Resolve 0/0 forms by factoring, rationalising and simplifying."
          - Justify each step with the "agree except at a point" lemma.
        results:
          - {label: lem-calc-limit-agree-except-point, policy: F}
      - label: calc-squeeze-theorem
        file: limits/squeeze-theorem.md
        title: The Squeeze Theorem
        level: core
        prerequisites: [calc-limit-laws, calc-trig-functions]
        objectives:
          - "Apply the squeeze theorem, including to oscillating factors."
          - "Prove $\\lim_{x\\to0}\\frac{\\sin x}{x}=1$ geometrically."
          - Use it for related trigonometric limits.
        widgets: [function-plot]
        results:
          - {label: thm-calc-squeeze, policy: R}
          - {label: thm-calc-sin-x-over-x, policy: F, note: "geometric, via `lem-calc-sin-bounds`; *must not* use derivatives or L'Hôpital"}
          - {label: cor-calc-one-minus-cos-over-x, policy: F}
        notes:
          - "Widget function-plot: squeeze band"
      - label: calc-infinite-limits
        file: limits/infinite-limits.md
        title: Infinite Limits and Vertical Asymptotes
        level: core
        prerequisites: [calc-one-sided-limits]
        objectives:
          - Determine infinite one-sided limits via sign analysis.
          - Locate vertical asymptotes.
          - Explain why "$=\infty$" means the limit does not exist in ℝ.
        results:
          - {label: def-calc-infinite-limit, note: precise version in rigorous track}
          - {label: def-calc-vertical-asymptote}
          - {label: prop-calc-reciprocal-power-limits, policy: F}
      - label: calc-limits-at-infinity
        file: limits/limits-at-infinity.md
        title: Limits at Infinity and Horizontal Asymptotes
        level: core
        prerequisites: [calc-limit-laws, calc-infinite-limits]
        objectives:
          - Compute limits at ±∞ of rational and root expressions.
          - Find horizontal asymptotes.
          - Compare growth informally.
        results:
          - {label: def-calc-limit-at-infinity, note: "precise: ε–M"}
          - {label: thm-calc-limit-laws-at-infinity, policy: S}
          - {label: prop-calc-rational-at-infinity, policy: F}
  - slug: continuity
    title: Continuity
    topics:
      - label: calc-continuity
        file: continuity/continuity.md
        title: Continuity
        level: core
        prerequisites: [calc-limit-laws, calc-one-sided-limits]
        objectives:
          - Test continuity at a point and on an interval.
          - "Classify discontinuities (removable, jump, infinite, oscillating)."
          - Build continuous functions from known ones.
        results:
          - {label: def-calc-continuity}
          - {label: def-calc-continuity-interval}
          - {label: thm-calc-continuity-algebra, policy: F, note: from the limit laws}
      - label: calc-continuity-elementary
        file: continuity/continuity-of-elementary-functions.md
        title: Continuity of Elementary Functions
        level: core
        prerequisites: [calc-continuity, calc-squeeze-theorem, calc-logarithms, calc-inverse-trig]
        objectives:
          - "Justify continuity of polynomial, rational, root, trigonometric, exponential and logarithmic functions on their domains."
          - Evaluate limits of compositions.
        results:
          - {label: thm-calc-limit-of-composition, policy: R}
          - {label: thm-calc-composition-continuous, policy: F, note: given the previous}
          - {label: prop-calc-sin-cos-continuous, policy: F, note: via squeeze}
          - {label: prop-calc-exp-log-continuous, policy: S+D, deferred_to: calc-ln-integral}
          - {label: thm-calc-inverse-continuous, policy: S+D, deferred_to: ana}
      - label: calc-ivt
        file: continuity/intermediate-value-theorem.md
        title: The Intermediate Value Theorem
        level: core
        prerequisites: [calc-continuity]
        objectives:
          - Apply the IVT to prove existence of roots and solutions.
          - Locate roots by bisection.
          - Explain why continuity is needed.
        widgets: [function-plot]
        results:
          - {label: thm-calc-ivt, policy: S+R, note: "S in core (picture), R full proof by bisection plus `ax-calc-completeness`"}
          - {label: cor-calc-root-existence, policy: F}
        notes:
          - "Widget function-plot: bisection mode"
      - label: calc-evt
        file: continuity/extreme-value-theorem.md
        title: The Extreme Value Theorem
        level: core
        prerequisites: [calc-continuity]
        objectives:
          - State the EVT and check its hypotheses.
          - Give counterexamples when a hypothesis fails.
        results:
          - {label: thm-calc-evt, policy: S+D, deferred_to: ana, note: "S, full proof D (Bolzano–Weierstrass)"}
          - {label: eg-calc-evt-hypotheses-needed, policy: F, note: counterexamples}
  - slug: derivatives
    title: Derivatives
    topics:
      - label: calc-tangents-rates
        file: derivatives/tangent-lines-and-rates.md
        title: Tangent Lines and Rates of Change
        level: core
        prerequisites: [calc-limit]
        objectives:
          - Compute slopes of secant lines and average rates.
          - Obtain tangent slopes and instantaneous velocity as limits.
        widgets: [secant-tangent]
        results:
          - {label: def-calc-average-rate}
          - {label: def-calc-tangent-line}
      - label: calc-derivative
        file: derivatives/the-derivative.md
        title: The Derivative
        level: core
        prerequisites: [calc-tangents-rates, calc-continuity]
        objectives:
          - Compute derivatives from the definition.
          - Interpret $f'$ as a function and sketch it from the graph of $f$.
          - "Recognise non-differentiability (corner, cusp, vertical tangent, discontinuity)."
        widgets: [zoom-to-linear, function-plot]
        results:
          - {label: def-calc-derivative}
          - {label: def-calc-differentiable}
          - {label: thm-calc-differentiable-implies-continuous, policy: F}
          - {label: eg-calc-derivative-abs-not-differentiable, policy: F}
        notes:
          - "Widget function-plot: f and f′ linked"
      - label: calc-differentiation-rules
        file: derivatives/differentiation-rules.md
        title: Basic Differentiation Rules
        level: core
        prerequisites: [calc-derivative]
        objectives:
          - "Differentiate polynomials and rational functions with the constant, power (integer), sum, product and quotient rules."
          - Find tangent lines.
        results:
          - {label: thm-calc-power-rule-integer, policy: F}
          - {label: thm-calc-sum-rule, policy: F}
          - {label: thm-calc-product-rule, policy: F}
          - {label: thm-calc-quotient-rule, policy: F}
      - label: calc-derivatives-trig
        file: derivatives/derivatives-of-trigonometric-functions.md
        title: Derivatives of Trigonometric Functions
        level: core
        prerequisites: [calc-differentiation-rules, calc-squeeze-theorem]
        objectives:
          - Derive $(\sin x)'=\cos x$ from the fundamental trigonometric limits.
          - Differentiate all six trigonometric functions.
        results:
          - {label: thm-calc-derivative-sin-cos, policy: F}
          - {label: cor-calc-derivative-tan-etc, policy: F}
      - label: calc-chain-rule
        file: derivatives/chain-rule.md
        title: The Chain Rule
        level: core
        prerequisites: [calc-differentiation-rules]
        objectives:
          - Differentiate compositions in prime and Leibniz notation.
          - Recognise the composition structure of expressions.
        results:
          - {label: thm-calc-chain-rule, policy: F, note: "via the Carathéodory/\"linear approximation\" formulation, which avoids the $\\Delta u = 0$ gap of the classic proof; a remark explains the gap"}
      - label: calc-implicit-differentiation
        file: derivatives/implicit-differentiation.md
        title: Implicit Differentiation
        level: core
        prerequisites: [calc-chain-rule]
        objectives:
          - Differentiate implicitly defined curves.
          - Find tangent lines to curves such as circles and the folium.
          - Explain when implicit differentiation is justified (implicit function theorem D → `mvc`).
        results:
          - {label: rem-calc-implicit-function-theorem, policy: D, deferred_to: mvc, note: statement}
      - label: calc-inverse-function-derivatives
        file: derivatives/derivatives-of-inverse-functions.md
        title: Derivatives of Inverse Functions
        level: core
        prerequisites: [calc-chain-rule, calc-continuity-elementary, calc-derivatives-trig]
        objectives:
          - "Apply $(f^{-1})'(y)=1/f'(f^{-1}(y))$."
          - "Derive the derivatives of arcsin, arccos and arctan."
        results:
          - {label: thm-calc-inverse-function-derivative, policy: S+R, note: "S in core (formula from the chain rule *assuming* differentiability), R full proof"}
          - {label: cor-calc-derivative-inverse-trig, policy: F}
      - label: calc-derivatives-exp-log
        file: derivatives/derivatives-of-exponential-and-logarithmic-functions.md
        title: Derivatives of Exponential and Logarithmic Functions
        level: core
        prerequisites: [calc-inverse-function-derivatives]
        objectives:
          - "Differentiate $e^x$, $a^x$, $\\ln x$, $\\log_b x$ and $x^r$ for real $r$."
          - Use logarithmic differentiation.
        results:
          - {label: lem-calc-exp-limit, policy: D, deferred_to: calc-ln-integral, note: "$\\lim_{h\\to0}\\frac{e^h-1}{h}=1$; stated as a fact characterising $e$"}
          - {label: thm-calc-derivative-exp, policy: F, note: given the lemma}
          - {label: thm-calc-derivative-ln, policy: F}
          - {label: thm-calc-general-power-rule, policy: F}
      - label: calc-higher-derivatives
        file: derivatives/higher-derivatives.md
        title: Higher Derivatives
        level: core
        prerequisites: [calc-derivatives-trig]
        objectives:
          - Compute second and $n$-th derivatives.
          - Interpret acceleration.
          - "Find patterns (e.g. $(\\sin x)^{(n)}$)."
        results:
          - {label: def-calc-higher-derivative}
          - {label: prop-calc-leibniz-product-rule, policy: R, note: by induction}
      - label: calc-related-rates
        file: derivatives/related-rates.md
        title: Related Rates
        level: core
        prerequisites: [calc-implicit-differentiation, calc-derivatives-trig]
        objectives:
          - Model a related-rates problem.
          - Differentiate the relation with respect to time.
          - Interpret the result with units.
        results: []
        notes:
          - None (method page).
          - ≥ 5 worked examples.
  - slug: derivative-applications
    title: Applications of Derivatives
    topics:
      - label: calc-extreme-values
        file: derivative-applications/extreme-values.md
        title: Extreme Values and Critical Points
        level: core
        prerequisites: [calc-differentiation-rules, calc-evt]
        objectives:
          - Distinguish local and global extrema.
          - Find critical points.
          - Apply the closed interval method.
        results:
          - {label: def-calc-local-extremum}
          - {label: def-calc-critical-point}
          - {label: thm-calc-fermat, policy: F}
      - label: calc-mean-value-theorem
        file: derivative-applications/mean-value-theorem.md
        title: Rolle's Theorem and the Mean Value Theorem
        level: core
        prerequisites: [calc-extreme-values]
        objectives:
          - State and apply Rolle's theorem and the MVT.
          - Use the MVT to prove inequalities and uniqueness of roots.
        widgets: [secant-tangent]
        results:
          - {label: thm-calc-rolle, policy: F}
          - {label: thm-calc-mvt, policy: F}
          - {label: cor-calc-zero-derivative-constant, policy: F}
          - {label: cor-calc-same-derivative, policy: F}
        notes:
          - "Widget secant-tangent: MVT mode"
      - label: calc-monotonicity
        file: derivative-applications/monotonicity.md
        title: Monotonicity and the First Derivative Test
        level: core
        prerequisites: [calc-mean-value-theorem]
        objectives:
          - Determine intervals of increase and decrease from the sign of $f'$.
          - Classify critical points with the first derivative test.
        results:
          - {label: thm-calc-monotonicity-test, policy: F, note: from the MVT}
          - {label: thm-calc-first-derivative-test, policy: F}
      - label: calc-concavity
        file: derivative-applications/concavity.md
        title: Concavity and the Second Derivative Test
        level: core
        prerequisites: [calc-monotonicity, calc-higher-derivatives]
        objectives:
          - Determine concavity and inflection points.
          - Apply the second derivative test and know when it is inconclusive.
        results:
          - {label: def-calc-concave, note: via increasing $f'$}
          - {label: thm-calc-concavity-test, policy: F}
          - {label: thm-calc-second-derivative-test, policy: F}
      - label: calc-curve-sketching
        file: derivative-applications/curve-sketching.md
        title: Curve Sketching
        level: core
        prerequisites: [calc-concavity, calc-limits-at-infinity]
        objectives:
          - "Produce a complete sketch (domain, symmetry, intercepts, asymptotes including oblique, monotonicity, extrema, concavity)."
          - Check it against a plot.
        widgets: [function-plot]
        results:
          - {label: def-calc-oblique-asymptote}
        notes:
          - Method page.
          - "Widget function-plot: reveal features step by step"
      - label: calc-optimisation
        file: derivative-applications/optimisation.md
        title: Optimisation Problems
        level: core
        prerequisites: [calc-monotonicity]
        objectives:
          - Translate a word problem into an objective function with constraints.
          - Justify that a critical point is a global optimum.
        results:
          - {label: prop-calc-single-critical-point, policy: F, note: a unique local extremum on an interval is global}
      - label: calc-lhopital
        file: derivative-applications/lhopital.md
        title: Indeterminate Forms and L'Hôpital's Rule
        level: core
        prerequisites: [calc-mean-value-theorem, calc-derivatives-exp-log, calc-limits-at-infinity]
        objectives:
          - Identify indeterminate forms.
          - Apply L'Hôpital's rule correctly (checking hypotheses).
          - "Convert $0\\cdot\\infty$, $\\infty-\\infty$, $1^\\infty$, $0^0$, $\\infty^0$."
