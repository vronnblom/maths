<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" role="img">
  <rect x="0" y="0" width="340" height="200" rx="8" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#24292f" text-anchor="middle">
    <!-- number line: 0 at x = 50, one unit = 100 px -->
    <line x1="20" y1="160" x2="318" y2="160" stroke="#24292f" stroke-width="1.5"/>
    <path d="M318,155 L328,160 L318,165 Z" fill="#24292f"/>
    <line x1="50" y1="154" x2="50" y2="166" stroke="#24292f" stroke-width="1.5"/>
    <line x1="150" y1="154" x2="150" y2="166" stroke="#24292f" stroke-width="1.5"/>
    <line x1="250" y1="154" x2="250" y2="166" stroke="#24292f" stroke-width="1.5"/>
    <text x="50" y="184">0</text>
    <text x="150" y="184">1</text>
    <text x="250" y="184">2</text>
    <!-- unit square and its diagonal -->
    <rect x="50" y="60" width="100" height="100" fill="#0b5cad" fill-opacity="0.08" stroke="#0b5cad" stroke-width="2"/>
    <line x1="50" y1="160" x2="150" y2="60" stroke="#9a3412" stroke-width="2.5"/>
    <!-- the diagonal swung down onto the line: radius 141.42 about 0 -->
    <path d="M150,60 A141.42,141.42 0 0 1 191.42,160" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="191.42" cy="160" r="5" fill="#9a3412"/>
  </g>
</svg>
