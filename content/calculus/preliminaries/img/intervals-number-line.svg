<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160" role="img">
  <rect x="0" y="0" width="360" height="160" rx="8" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="13" fill="#24292f" text-anchor="middle" stroke-linecap="round">
    <!-- position of t: x = 130 + 45 t -->
    <!-- first line: the interval [-1, 3) -->
    <line x1="20" y1="45" x2="338" y2="45" stroke="#24292f" stroke-width="1.2"/>
    <path d="M338,41 L346,45 L338,49 Z" fill="#24292f"/>
    <g stroke="#24292f" stroke-width="1.2">
      <line x1="40" y1="40" x2="40" y2="50"/><line x1="85" y1="40" x2="85" y2="50"/>
      <line x1="130" y1="40" x2="130" y2="50"/><line x1="175" y1="40" x2="175" y2="50"/>
      <line x1="220" y1="40" x2="220" y2="50"/><line x1="265" y1="40" x2="265" y2="50"/>
      <line x1="310" y1="40" x2="310" y2="50"/>
    </g>
    <text x="40" y="70">−2</text><text x="85" y="70">−1</text><text x="130" y="70">0</text>
    <text x="175" y="70">1</text><text x="220" y="70">2</text><text x="265" y="70">3</text>
    <text x="310" y="70">4</text>
    <line x1="85" y1="45" x2="265" y2="45" stroke="#0b5cad" stroke-width="5"/>
    <circle cx="85" cy="45" r="6" fill="#0b5cad" stroke="#0b5cad" stroke-width="2"/>
    <circle cx="265" cy="45" r="6" fill="#ffffff" stroke="#0b5cad" stroke-width="2.5"/>
    <!-- second line: the interval (2, infinity) -->
    <line x1="20" y1="115" x2="338" y2="115" stroke="#24292f" stroke-width="1.2"/>
    <path d="M338,111 L346,115 L338,119 Z" fill="#24292f"/>
    <g stroke="#24292f" stroke-width="1.2">
      <line x1="40" y1="110" x2="40" y2="120"/><line x1="85" y1="110" x2="85" y2="120"/>
      <line x1="130" y1="110" x2="130" y2="120"/><line x1="175" y1="110" x2="175" y2="120"/>
      <line x1="220" y1="110" x2="220" y2="120"/><line x1="265" y1="110" x2="265" y2="120"/>
      <line x1="310" y1="110" x2="310" y2="120"/>
    </g>
    <text x="40" y="140">−2</text><text x="85" y="140">−1</text><text x="130" y="140">0</text>
    <text x="175" y="140">1</text><text x="220" y="140">2</text><text x="265" y="140">3</text>
    <text x="310" y="140">4</text>
    <line x1="220" y1="115" x2="326" y2="115" stroke="#0b5cad" stroke-width="5"/>
    <path d="M324,108 L338,115 L324,122 Z" fill="#0b5cad"/>
    <circle cx="220" cy="115" r="6" fill="#ffffff" stroke="#0b5cad" stroke-width="2.5"/>
  </g>
